name: talk-with-hermes
label: Talk with Hermes
version: 0.2.0
manifest_version: 1
kind: standalone
description: "Talk to your Hermes agent by voice, full duplex, in Hermes Desktop and in Discord voice channels. Adds /talk and a gateway task that brings the agent into the voice channels routed to it."
author: Kavyro
license: MIT
requires_hermes: ">=0.23.0"
python_dependencies:
  - "numpy>=2,<3"
provides_tools: []
provides_hooks: []
config_schema:
  gemini_api_key:
    type: secret
    env: GEMINI_API_KEY
    label: Gemini key (AI Studio)
    description: "Key created at aistudio.google.com/apikey. Entered here once: Desktop and the Discord voice channels of every agent use it. Stored in this profile's .env, never copied elsewhere."
  openai_api_key:
    type: secret
    env: OPENAI_API_KEY
    label: OpenAI key (gpt-realtime models)
    description: "API key from platform.openai.com. Used only when the voice model starts with gpt-."
  xai_api_key:
    type: secret
    env: XAI_API_KEY
    label: xAI key (grok-voice models)
    description: "API key from console.x.ai. Used only when the voice model starts with grok-."
  model:
    type: str
    choices: [gemini-3.8-live, gemini-3.1-flash-live-preview, gpt-realtime-2.1, gpt-realtime-2, grok-voice-latest, grok-voice-3.0]
    default: gemini-3.8-live
    label: Voice model
    description: "The model picks the service: gemini- (Gemini Live, proven in real calls), gpt- (OpenAI Realtime) or grok- (Grok Voice), these two not tried in a real call yet. Gemini's extended-thinking variants are excluded: they cannot delegate to the agent."
  voice:
    type: str
    default: ""
    label: Default voice
    description: "Chosen on the Talk page, among the voices of the current service. A voice from another service is replaced by the default voice of the service."
  spoken_answers:
    type: str
    choices: [full, brief]
    default: full
    label: Spoken answers
    description: "full: the voice says the whole answer of the agent. brief: two to four sentences."
  languages:
    type: str
    default: fr-FR
    label: Spoken languages
    description: "Comma-separated codes, for example fr-FR,en-US. Helps transcription."
